<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>GitHub Profile Info</h1>
        <div id="profile-info">
            <p><strong>Name:</strong> <span id="name">{{ data.name }}</span></p>
            <p><strong>Email:</strong> <span id="email">{{ data.email }}</span></p>
            <p><strong>Login:</strong> <span id="login">{{ data.login }}</span></p>
            <p><strong>Location:</strong> <span id="location">{{ data.location }}</span></p>
            <p><strong>Bio:</strong> <span id="bio">{{ data.bio }}</span></p>
            <p><strong>Stars:</strong> <span id="stars">{{ data.stars }}</span></p>
            <p><strong>Commits:</strong> <span id="commits">{{ data.commits }}</span></p>
            <p><strong>Repos:</strong> <span id="repos">{{ data.repos }}</span></p>
            <p><strong>Followers:</strong> <span id="followers">{{ data.followers }}</span></p>
            <p><strong>Following:</strong> <span id="following">{{ data.following }}</span></p>
        </div>
        <form id="update-form" class="mt-4">
            <div class="mb-3">
                <label for="username" class="form-label">Enter GitHub Username:</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <button type="submit" class="btn btn-primary">Update Profile</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
